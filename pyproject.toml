[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partex"
version = "0.1.0"
description = "Offline web application security evidence review"
requires-python = ">=3.14"
dependencies = [
    "logfire>=5.6",  # cli.py --logfire (§11.1); already locked via pydantic-clai2, now declared since partex imports it
    "pydantic-ai-slim>=2.68",
    "pydantic-ai-harness[repair-tool-arguments]>=0.68",
    "pydantic-clai2>=0.68",
    "pyyaml>=6",  # registry.py skill frontmatter (already locked transitively)
    "tree-sitter>=0.26.1",
    "tree-sitter-javascript>=0.25.0",
]

[project.scripts]
partex = "partex.__main__:main"

[project.entry-points."partex.checks"]
header-security = "partex.checks.header_security:header_security_check"
js-analysis = "partex.checks.js_analysis:js_analysis_check"
version-disclosure = "partex.checks.version_disclosure:version_disclosure_check"

# Supply-chain cool-off: only resolve registry artifacts uploaded at least 2 days ago, so a
# freshly published (possibly compromised) release can't land in the lockfile before it has
# had time to be noticed and yanked. Relative span, recorded in uv.lock as exclude-newer-span.
# Urgent fixes: add a reviewed per-package `exclude-newer-package` override, never drop this.
# The cool-off stays on for everything except the pydantic-ai stack, which the operator wants to track as it
# releases (#107). Each exempt package is listed by name; do not widen this to a global override.
[tool.uv]
exclude-newer = "2 days"
exclude-newer-package = { pydantic-ai-slim = false, pydantic-graph = false, pydantic-ai-harness = false, pydantic-clai2 = false, pydantic-ai-pax = false, pydantic-monty = false, pydantic-monty-client = false, pydantic-monty-runtime = false }

[dependency-groups]
dev = ["anyio", "inline-snapshot", "pyright", "pytest", "pytest-cov", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/partex"]

# Built-in skills ship as package data (`partex/skills/`); `skills/` itself stays a
# plain repo directory — never imported or executed (CLAUDE.md).
[tool.hatch.build.targets.wheel.force-include]
"skills" = "partex/skills"

[tool.ruff]
include = ["*.py", "*.pyi", "pyproject.toml"]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "scripts"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["scripts/check_greenfield.py", "scripts/check_httpx2_gate.py", "tests"]

[tool.coverage.run]
branch = true
source = ["partex"]
