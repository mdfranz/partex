[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partex-banner-leak"
version = "0.1.0"
description = "Fixture distribution proving third-party checks register with no engine edits (PLAN §13.2)"
requires-python = ">=3.14"

[project.entry-points."partex.checks"]
banner-leak = "banner_leak:banner_leak_check"

[tool.hatch.build.targets.wheel]
include = ["banner_leak.py"]
